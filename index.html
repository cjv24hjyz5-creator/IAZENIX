<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IAZENIX – Shorts à partir d'un lien YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070c;--surface:#12121b;--ink:#f3f3f8;--muted:#9b9bb2;--line:#25253a;--accent:#34d399;--accent-ink:#0a0a12;--hi:#ffd84d;--err:#ff7b8f;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:880px;margin:0 auto;padding:40px 20px 64px}
h1{font-size:clamp(2rem,7vw,3.6rem);line-height:1.02;font-weight:800;letter-spacing:-.03em;margin:0 0 14px}
.lead{color:var(--muted);font-size:1.05rem;margin:0 0 28px;max-width:46ch}
form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 260px;min-width:0;font:inherit;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:14px 22px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);min-height:1.5em;margin:8px 0 0;font-size:.95rem}
.note{font-size:.85rem;color:var(--muted);margin-top:6px}
#status{margin:36px 0 0;font-weight:600}
#result{margin-top:32px}
#result[hidden],#status[hidden]{display:none}
.bar-wrap{margin-bottom:28px}
.bar-label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.bar{position:relative;height:34px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 14px),var(--surface);border:1px solid var(--line);overflow:hidden}
.seg{position:absolute;top:0;bottom:0;background:var(--hi);opacity:.45;transition:opacity .15s,outline-color .15s;outline:2px solid transparent;outline-offset:-2px}
.seg.on{opacity:1;outline-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.phone{aspect-ratio:9/16;max-height:300px;width:100%;border-radius:10px;display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:800;font-size:1.15rem;line-height:1.15;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.meta{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.score{font-weight:600;color:var(--ink)}
.card button{padding:10px 14px;background:transparent;color:var(--ink);border:2px solid var(--line)}
.card button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.demo{margin-top:26px;font-size:.88rem;color:var(--muted);border-left:3px solid var(--hi);padding-left:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
video{width:100%;aspect-ratio:9/16;max-height:420px;border-radius:10px;background:#000;object-fit:cover}
.card h2{font-size:1.05rem;line-height:1.2;margin:0}.reason{font-size:.88rem;color:var(--muted);margin:0}
a.dl{display:block;text-align:center;text-decoration:none;font-weight:600;padding:10px 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink)}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(52,211,153,.28),transparent 60%),radial-gradient(700px 400px at -10% 30%,rgba(22,163,74,.16),transparent 60%),var(--bg);background-attachment:fixed}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:36px}
.dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#34d399,#16a34a);box-shadow:0 0 14px #34d399}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:.18em;background:linear-gradient(90deg,#a7f3d0,#16a34a);-webkit-background-clip:text;background-clip:text;color:transparent}
input{background:rgba(255,255,255,.04)}
button{box-shadow:0 0 24px rgba(52,211,153,.35)}
.card{box-shadow:0 0 0 1px rgba(52,211,153,.08),0 12px 40px rgba(0,0,0,.4)}
.card button{box-shadow:none}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="dot"></span><span class="logo">IAZENIX</span></div>
  <h1>Colle un lien YouTube. Récupère tes meilleurs shorts.</h1>
  <p class="lead">Le site repère les moments forts de la vidéo et les découpe en format vertical, prêts à publier.</p>
  <form id="f" novalidate>
    <input id="url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=…" aria-label="Lien de la vidéo YouTube" autocomplete="off">
    <button id="go" type="submit">Générer mes shorts</button>
  </form>
  <p class="note">ou envoie directement ta vidéo (recommandé, ça marche à tous les coups)</p>
  <input id="file" type="file" accept="video/*" aria-label="Envoyer une vidéo depuis ton appareil">
  <p class="err" id="err" role="alert"></p>
  <p id="status" hidden aria-live="polite"></p>
  <section id="result" hidden>
    
    <div class="grid" id="grid"></div>
    
  </section>
</main>
<script>
(function(){
  var f=document.getElementById('f'),url=document.getElementById('url'),go=document.getElementById('go'),
      err=document.getElementById('err'),st=document.getElementById('status'),res=document.getElementById('result'),
      grid=document.getElementById('grid');
  function fmt(t){var m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function fail(msg){st.hidden=true;go.disabled=false;err.textContent=msg}
  function render(clips){
    grid.innerHTML="";
    clips.forEach(function(c){
      var card=el('div','card'),v=el('video');
      v.src=c.url;v.controls=true;v.playsInline=true;v.preload='metadata';
      var meta=el('div','meta');meta.appendChild(el('span',null,fmt(c.start)+' à '+fmt(c.end)));meta.appendChild(el('span','score','Score '+c.score+'/100'));
      var a=el('a','dl','Télécharger');a.href=c.url;a.download='';
      card.appendChild(v);card.appendChild(el('h2',null,c.title));card.appendChild(meta);card.appendChild(el('p','reason',c.reason));card.appendChild(a);
      grid.appendChild(card);
    });
    res.hidden=false;
  }
  function poll(id){
    fetch('/api/jobs/'+id).then(function(r){return r.json()}).then(function(j){
      if(j.status==='running'){st.textContent=j.step+'…';setTimeout(function(){poll(id)},2500)}
      else if(j.status==='error'){fail(j.error)}
      else{st.hidden=true;go.disabled=false;render(j.clips)}
    }).catch(function(){fail("Connexion perdue avec le serveur. Réessaie.")});
  }
  f.addEventListener('submit',function(e){
    e.preventDefault();err.textContent='';res.hidden=true;
    if(!/youtu\.?be/.test(url.value)){err.textContent="Colle l'adresse complète d'une vidéo YouTube.";return}
    go.disabled=true;st.hidden=false;st.textContent="Envoi du lien…";
    fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url.value})})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.detail);return j})})
      .then(function(j){poll(j.id)})
      .catch(function(x){fail(x.message||"Impossible de joindre le serveur.")});
  });
  document.getElementById('file').addEventListener('change',function(e){
    var fl=e.target.files[0];if(!fl)return;
    err.textContent='';res.hidden=true;go.disabled=true;st.hidden=false;st.textContent="Envoi de la vidéo…";
    var fd=new FormData();fd.append('file',fl);
    fetch('/api/upload',{method:'POST',body:fd})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.detail);return j})})
      .then(function(j){poll(j.id)})
      .catch(function(x){fail(x.message||"Envoi impossible. Réessaie.")});
  });
})();
</script>
</body>
</html>
